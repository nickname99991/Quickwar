name: Build QuickBedWars

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip

      - name: Extract project
        run: |
          mkdir project
          ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)
          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

      - name: Build
        run: |
          PROJECT_DIR=$(dirname "$(find project -name build.gradle -print -quit)")
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          $GITHUB_WORKSPACE/gradle-2.14.1/bin/gradle build --no-daemon
        env:
          GRADLE_OPTS: -Xmx4g

      - name: Find built JAR
        run: |
          echo "Looking for JAR files..."
          find project -type f -path "*/build/libs/*.jar" -print

          JAR=$(find project -type f -path "*/build/libs/*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "No built JAR found!"
            exit 1
          fi

          echo "Found: $JAR"
          cp "$JAR" QuickBedWars.jar

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: QuickBedWars-Mod
          path: QuickBedWars.jar
          if-no-files-found: error
