name: Build QuickBedWars

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q QuickBedWars-Forge1.8.9.zip -d project

      - name: Fix ClientRegistry
        run: |
          FILE=$(find project -path "*/src/main/java/*/QuickBedWars.java" -print -quit)

          if [ -z "$FILE" ]; then
            echo "QuickBedWars.java not found"
            find project -type f | sort
            exit 1
          fi

          echo "Found: $FILE"

          sed -i 's/import net\.minecraftforge\.client\.ClientRegistry;/import net.minecraftforge.fml.client.registry.ClientRegistry;/' "$FILE"

          echo "Fixed ClientRegistry import:"
          grep "ClientRegistry" "$FILE"

      - name: Find project
        run: |
          BUILD_FILE=$(find project -name build.gradle -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "build.gradle not found"
            find project -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cd "$PROJECT_DIR"
          "$GITHUB_WORKSPACE/gradle-2.14.1/bin/gradle" build --no-daemon

      - name: Find JAR
        run: |
          JAR=$(find project -path "*/build/libs/*.jar" \
            ! -name "*sources*" \
            ! -name "*dev*" \
            -print -quit)

          if [ -z "$JAR" ]; then
            echo "JAR not found"
            find project -type f -name "*.jar" | sort
            exit 1
          fi

          echo "Found JAR: $JAR"
          cp "$JAR" QuickBedWars.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: QuickBedWars
          path: QuickBedWars.jar
